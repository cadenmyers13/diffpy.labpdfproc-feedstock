{% set name = "diffpy.labpdfproc" %}
{% set version = "0.3.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_labpdfproc/diffpy_labpdfproc-{{ version }}.tar.gz
  sha256: c8d4a54c323592704d20257ae2efb904fd6fc70efed13e5d2e94f378760ea9af

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - labpdfproc = diffpy.labpdfproc.labpdfprocapp:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - numpy
    - diffpy.utils
    - pandas
    - scipy
    - gooey

test:
  requires:
    - pip
    - pytest
    - pytest-mock
  imports:
    - diffpy.labpdfproc
  source_files:
    - tests
  commands:
    - pip check
    - pip list
    - pytest

about:
  home: https://github.com/diffpy/diffpy.labpdfproc/
  summary: A Python package for processing x-ray powder diffraction data from laboratory sources.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  description: |
    A Python package for processing x-ray powder diffraction data from laboratory sources.
  doc_url: https://diffpy.github.io/diffpy.labpdfproc/
  dev_url: https://github.com/diffpy/diffpy.labpdfproc/

extra:
  recipe-maintainers:
    - sbillinge
    - yucongalicechen
    - cadenmyers13
